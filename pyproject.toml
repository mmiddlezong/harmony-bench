[project]
name = "harmonybench"
version = "0.1.0"
description = "HarmonyBench: benchmarking frontier AI models at reading harmony from music score images"
readme = "README.md"
authors = [
    { name = "Michael Middlezong", email = "mmiddlezong@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "google-genai>=2.25.0",
    "music21>=10.5.0",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "resvg-py>=0.5.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "verovio>=6.3.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpserver>=1.1.5",
    "ruff>=0.16.9",
]

[project.scripts]
harmonybench = "harmonybench.cli:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# the HTML template in site.py has long lines that read better unwrapped
"src/harmonybench/site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
